  body {
      margin: 0;
      min-height: 100vh;
      color: white;
      text-align: center;
      text-shadow: 0 0 5px rgba(0,0,0,0.6);
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: "Designer", sans-serif;

    }

    body::before, body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      transition: opacity 2s ease-in-out;
    }

    body::before {
      background: linear-gradient(120deg, darkblue, blue, #E10600, yellow);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      opacity: 1;
      overflow: hidden;
    }

    body::after {
      background-image: url('123.png');
      opacity: 0;
      
    }

    body.gradient-active::before {
      opacity: 0;
    }
    body.gradient-active::after {
      opacity: 1;
    }
  
    .intro {
      transition: opacity 1s ease;
    }

    .logo {
      margin-top: 150px;
      opacity: 0;
      animation: fadeInOpacity 2s ease forwards;

    }

    .logo img {
      width: 400px;
      max-width: 90vw;
      height: auto;
      cursor: pointer;
      display: inline-block;
      transform:scale(1);
      transition: all 0.5s ease;
    }
    .logo img:hover{
      transform: scale(1.03);
      transition: all 0.5s ease;
    }


    .paragraph {
      margin-top: 20px;
      font-size: 24px;
      opacity: 0;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
      transition: all 0.5s ease;
      animation:fadeinopacity 2s ease forwards;
      font-family: "Designer", sans-serif;
    }
    .paragraph:hover{
      transform: scale(1.03);
      transition: all 0.5s ease;
    }

  
    .main-content {
      display: none;
      opacity: 0;
      transition: opacity 1s ease;
    }
   .content-container {
  animation:fadeInOpacity 2s ease forwards;
  animation-delay: 1.5s;
  opacity:0;
}

.content-container img {
  width: 45%;
  height: auto;
  transition: transform 0.5s ease;
  animation-delay: 1.5s;
  align-items: center;
  justify-content: center;
}
.content-container img:hover {
  transform: scale(1.03);
}

.content-text {
    padding-top: 60px;
  opacity: 0;
  text-align: center;
  animation: fadeInOpacity 2s ease forwards;
  animation-delay: 2s;
     font-family: "Designer", sans-serif;

  
}

.content-text p {
  font-size: 50px;
  line-height: 1.6;
  text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
  margin: 0;
   transition: transform 0.5s ease;
   animation-delay: 1.5s;
}
.content-text p:hover {
  transform: scale(1.01);
  transition: transform 0.5s ease;
}
    
    .animate-fade-in {
      animation: fadeInOpacity 2s ease forwards;
    }

    .animate-text-fade-in {
      animation: fadeInOpacity 2s ease forwards;
      animation-delay: 1s;
    }

    @keyframes fadeInOpacity {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes gradientShift {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
 
}

<script>
    const link = document.getElementById('redbullLink');
  const audio = document.getElementById('max');

  link.addEventListener('click', async (e) => {
    e.preventDefault(); // stop immediate navigation [web:173]
    try { await audio.play(); } catch (err) { /* ignore */ } // play() returns a Promise [web:176]
    setTimeout(() => { window.location.href = link.href; }, 8000);
  });
$(document).ready(function () {
  const $logo = $('#logo');
  const $img = $logo.find('img');
  const $text = $('.paragraph');
  const $intro = $('#intro');
  const $main = $('#main');
  const $audio = $('#radio');
  const $modelViewer = $('#model-viewer');

  // Initial fade-in animations
  $logo.addClass('animate-fade-in');
  $img.addClass('animate-fade-in');
  $text.addClass('animate-text-fade-in');

  // When logo image is clicked
  $img.on('click', function () {
    if ($audio.length) {
      const playPromise = $audio[0].play();
      if (playPromise !== undefined) {
        playPromise.catch(err => console.warn('Audio play failed:', err));
      }
    }

    $('body').addClass('gradient-active');

    $intro.find('.logo, .paragraph').fadeTo(800, 0);
    $intro.delay(400).fadeTo(1000, 0, function () {
      $intro.hide();

      $main.css('display', 'block').hide().fadeTo(1000, 1, function () {
        revealNavbarSequentially();
      });
    });
  });

  // Sequential navbar reveal
  function revealNavbarSequentially() {
    const $navbarImgs = $('.navbar img');
    $navbarImgs.each(function (index) {
      $(this)
        .delay(index * 150)
        .queue(function (next) {
          $(this).addClass('reveal');
          next();
        });
    });
  }

});
</script>
