<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 Museum®</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  
    }
    li{float: left;}


li a {
  display: block;
  color: white;
  text-align: center;
  padding: 16px;
  text-decoration: none;
}
.navbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 30px;
      font-size: 18px;
    }

.navbar li a {
      display: block;
      padding: 10px;
      border-radius: 50%;
      transition: background-color 0.3s, border-radius 0.3s;
    }
.navbar img {
  filter: grayscale(100%);
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.25, 1.25, 0.5, 1);
}

.navbar img.reveal {
  opacity: 1;
  transform: translateY(0);
}
.navbar a:hover img {
  filter: grayscale(0%);
  transition: all 0.3s ease;
  transform: translateY(-2px) scale(1.1);

}

.racingbulls a:hover{background-color: darkblue;border-radius: 50%;}
.home a:hover{color: black;transition: 0.3s ease; transform:scale(1.1);}
  body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Orbitron', sans-serif;
      color: white;
      text-align: center;
      overflow: hidden;
      text-shadow: 0 0 5px rgba(0,0,0,0.6);
      position: relative;
    }

    body::before, body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      transition: opacity 2s ease-in-out;
    }

    body::before {
      background: linear-gradient(120deg, darkblue, blue, #E10600, yellow);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      opacity: 1;
    }

    body::after {
      background: linear-gradient(to bottom, #5A00A0, #000000);
      opacity: 0;
    }

    body.gradient-active::before {
      opacity: 0;
    }
    body.gradient-active::after {
      opacity: 1;
    }
  
    .intro {
      transition: opacity 1s ease;
    }

    .logo {
      margin-top: 150px;
      opacity: 0;
      animation: fadeInOpacity 2s ease forwards;

    }

    .logo img {
      width: 400px;
      max-width: 90vw;
      height: auto;
      cursor: pointer;
      display: inline-block;
      transform:scale(1);
      transition: all 0.5s ease;
    }
    .logo img:hover{
      transform: scale(1.03);
      transition: all 0.5s ease;
    }


    .paragraph {
      margin-top: 20px;
      font-size: 24px;
      opacity: 0;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
      transition: all 0.5s ease;
      animation:fadeinopacity 2s ease forwards;
    }
    .paragraph:hover{
      transform: scale(1.03);
      transition: all 0.5s ease;
    }

  
    .main-content {
      display: none;
      opacity: 0;
      transition: opacity 1s ease;
    }
   .content-container {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 40px;
  padding: 40px;
  flex-wrap: wrap; 
  animation:fadeInOpacity 2s ease forwards;
  animation-delay: 1.5s;
  opacity:0;
}

.content-container img {
  width: 100%;
  max-width: 500px;
  height: auto;
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
  transition: transform 0.5s ease;
  animation-delay: 1.5s;
}
.caption figcaption {
  margin-top: 8px;
  font-size: 16px;
  color: #ddd;
  text-shadow: 1px 1px 5px rgba(0,0,0,0.6);
    transition: transform 0.5s ease;

}
.caption figcaption:hover {
  transform: scale(1.03);
  transition: transform 0.5s ease;
}

.content-container img:hover {
  transform: scale(1.03);
}

.content-text {
  opacity: 0;
  max-width: 800px;
  text-align: left;
  animation: fadeInOpacity 2s ease forwards;
  animation-delay: 2s;
}

.content-text p {
  font-size: 18px;
  line-height: 1.6;
  text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
  margin: 0;
   transition: transform 0.5s ease;
   animation-delay: 1.5s;
}
.content-text p:hover {
  transform: scale(1.03);
  transition: transform 0.5s ease;
}

    
    .animate-fade-in {
      animation: fadeInOpacity 2s ease forwards;
    }

    .animate-text-fade-in {
      animation: fadeInOpacity 2s ease forwards;
      animation-delay: 1s;
    }

    @keyframes fadeInOpacity {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes gradientShift {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
} 
    .button {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      outline: none;
    }
  </style>
</head>

<body>
 <audio id="radio" src="car-engine-372477.mp3"></audio>
  <div class="intro" id="intro">
    <div class="logo" id="logo">
      <button type="button" class="button">
        <img src="formula-1-official-white-logo-hd-transparent-background-701751712229658jhzn4h9awp-removebg-preview.png" alt="F1 Museum Logo">
      </button>
    </div>

    <div class="paragraph">
      <p>Welcome to the F1 Museum</p>
    </div>
  </div>


  
  <div class="main-content" id="main">
   
   <ul class="navbar">
      <li class="redbull"><a href="#RedBullRacing"><img src="redbull.png" width="60" alt="Red Bull Racing"></a></li>
      <li class="mercedes"><a href="#Mercedes-Benz"><img src="Mercedes-Logo.svg.webp" width="50" alt="Mercedes-Benz"></a></li>
      <li class="ferrari"><a href="#Ferrari"><img src="ferrari.png" width="50" alt="Ferrari"></a></li>
      <li class="mclaren"><a href="#McLaren"><img src="mclaren.png" width="100" alt="McLaren"></a></li>
      <li class="williams"><a href="#Williams"><img src="williams.png" width="60" alt="Williams"></a></li>
      <li class="kick"><a href="#KickSauber"><img src="kick-sauber.svg" width="75" alt="Kick Sauber"></a></li>
  <li class="alpine"><a href="#Alpine"><img src="alpine.png" width="75" alt="Alpine"></a></li>
      <li class="astonmartin"><a href="#AstonMartin"><img src="astonmartin.png" width="100" alt="Aston Martin"></a></li>
      <li class="haas"><a href="#Haas"><img src="haas.png" width="75" alt="Haas"></a></li>
      <li class="racingbulls"><a href="#RacingBulls"><img src="racingbulls.png" width="50" alt="Racing Bulls"></a></li>
            <li class="home"><a href="Home-page">Menu</a></li>

          </ul>

        <div class="content-container">
          <figure>
        <img src="grandprix.jpg" alt="Grand prix">
        <div class="caption">
        <figcaption> The First Grand Prix</figcaption>
        </div>
        <div class="content-text">
        <p>The first Formula 1 World Championship </p>
        </div>
      </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function () {
  const $logo = $('#logo');
  const $img = $logo.find('img');
  const $text = $('.paragraph');
  const $intro = $('#intro');
  const $main = $('#main');
  const $audio = $('#radio');
  const $modelViewer = $('#model-viewer');

  // Initial fade-in animations
  $logo.addClass('animate-fade-in');
  $img.addClass('animate-fade-in');
  $text.addClass('animate-text-fade-in');

  // When logo image is clicked
  $img.on('click', function () {
    if ($audio.length) {
      const playPromise = $audio[0].play();
      if (playPromise !== undefined) {
        playPromise.catch(err => console.warn('Audio play failed:', err));
      }
    }

    $('body').addClass('gradient-active');

    $intro.find('.logo, .paragraph').fadeTo(800, 0);
    $intro.delay(400).fadeTo(1000, 0, function () {
      $intro.hide();

      $main.css('display', 'block').hide().fadeTo(1000, 1, function () {
        revealNavbarSequentially();
      });
    });
  });

  // Sequential navbar reveal
  function revealNavbarSequentially() {
    const $navbarImgs = $('.navbar img');
    $navbarImgs.each(function (index) {
      $(this)
        .delay(index * 150)
        .queue(function (next) {
          $(this).addClass('reveal');
          next();
        });
    });
  }

});
</script>


 
</body>
</html>
